<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Recall Recorder – Preferences</title>
  </head>
  <body>
    <div class="container">
      <h1>Preferences</h1>

      <div class="field">
        <label for="recallApiKey">Recall API key</label>
        <input
          type="password"
          id="recallApiKey"
          placeholder="Enter your Recall API key"
        />
      </div>

      <div class="field">
        <label for="inboxFolder">Transcript inbox folder</label>
        <div class="folder-row">
          <input type="text" id="inboxFolder" readonly />
          <button id="browseBtn" type="button">Browse...</button>
        </div>
      </div>

      <div class="field">
        <label class="toggle-label">
          <input type="checkbox" id="autoRecord" />
          <span>Auto-record when meeting detected</span>
        </label>
      </div>

      <h2>In-person recording</h2>

      <div class="field">
        <label for="assemblyAiApiKey">AssemblyAI API key</label>
        <input
          type="password"
          id="assemblyAiApiKey"
          placeholder="Enter your AssemblyAI API key"
        />
      </div>

      <div class="field">
        <label for="inPersonMaxDurationMinutes">
          Auto-stop after (minutes)
        </label>
        <input
          type="number"
          id="inPersonMaxDurationMinutes"
          min="1"
          max="600"
          step="1"
          placeholder="60"
        />
      </div>

      <div class="actions">
        <button id="saveBtn" type="button">Save</button>
        <span id="saveStatus" class="status-msg"></span>
      </div>
    </div>
  </body>
</html>
